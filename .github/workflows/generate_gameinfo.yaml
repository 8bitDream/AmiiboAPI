name: Generate game info

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  get_info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and run generator
        run: >-
          dotnet run
          --project AGLG/AmiiboGameList/AmiiboGameList.csproj
          --configuration Release
          --no-launch-profile
          --
          -i ./database/amiibo.json
          -log 0
          -p 4
          -o ./games_info.json
          -allow-missing

      - name: Validate generated game info
        shell: bash
        run: |
          python - <<'PY'
          import json

          with open("games_info.json", encoding="utf-8") as file:
              data = json.load(file)

          amiibos = data.get("amiibos")
          if not isinstance(amiibos, dict) or not amiibos:
              raise SystemExit("Generated game info has no amiibo records.")

          platforms = ("games3DS", "gamesWiiU", "gamesSwitch", "gamesSwitch2")
          populated = sum(
              any(record.get(platform) for platform in platforms)
              for record in amiibos.values()
          )
          minimum_populated = max(1, len(amiibos) // 2)
          if populated < minimum_populated:
              raise SystemExit(
                  f"Generated game info only contains data for {populated}/{len(amiibos)} "
                  f"amiibo; refusing to publish fewer than {minimum_populated}."
              )
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: games_info
          path: games_info.json

  report:
    runs-on: ubuntu-latest
    needs: [get_info]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
            ref: dev

      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: games_info
          path: database/

      - name: Commit json files
        shell: pwsh
        run: |
          git config --local user.name 'AmiiboAPI (Automated)'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull origin dev
          git add -A database/games_info.json
          if(git commit -m "[Automated] Update: $(git diff --name-only --staged)") {
            git push
          }
